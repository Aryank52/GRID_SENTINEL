# Grid Sentinel Application Configuration
# Profile: default (development)

server:
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: grid-sentinel

  # Database
  datasource:
    url: jdbc:postgresql://localhost:5432/grid_sentinel
    username: gridsentinel
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA / Hibernate
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        jdbc:
          lob:
            non_contextual_creation: true
    hibernate:
      ddl-auto: validate # Flyway manages schema

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    default-schema: public

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # Security
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${APP_JWT_ISSUER:grid-sentinel}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
    health:
      show-details: when-authorized
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

# OpenAPI / SpringDoc
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.gridsentinel.api
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

# Application-specific
app:
  jwt:
    secret: ${JWT_SECRET:changemechangemechangemechangemechangemechangeme}
    issuer: grid-sentinel
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7

  # Risk engine defaults
  risk:
    default-model: deterministic-baseline
    default-version: 1.0.0
    cache-ttl-minutes: 60

  # Detection engine defaults
  detection:
    default-strategy: rule-based-fusion
    default-version: 1.0.0
    confidence-threshold: 0.7

  # Simulation defaults
  simulation:
    default-strategy: graph-cascade
    default-version: 1.0.0
    default-random-seed: 42
    max-concurrent-simulations: 5

  # Copilot
  copilot:
    enabled: true
    model: gpt-4o-mini
    max-tokens: 2000
    temperature: 0.1
    require-grounding: true

# Logging
logging:
  level:
    com.gridsentinel: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/grid-sentinel.log
    max-size: 100MB
    max-history: 30