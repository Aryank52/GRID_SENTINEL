spring:
  application:
    name: grid-sentinel
  profiles:
    active: dev
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:grid_sentinel;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        use_sql_comments: true
        globally_quoted_identifiers: true
        use_new_id_generator_mappings: true
        jdbc:
          lob:
            non_contextual_creation: true
        types:
          enable_enum_ordinal_mapping: true
        use_identifier_rollback: true
        enable_lazy_load_no_trans: true
        temp:
          use_jdbc_metadata_defaults: false
        hbm2ddl:
          auto: create-drop
        bytecode:
          use_reflection_optimizer: false
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        cache:
          use_second_level_cache: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080
  websocket:
    allowed-origins: "http://localhost:5173,http://localhost:3000"
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://localhost:5432/grid_sentinel
    username: grid_sentinel
    password: grid_sentinel
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgisPG95Dialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080
  websocket:
    allowed-origins: "http://localhost:5173,http://localhost:3000"

app:
  jwt:
    secret: "grid-sentinel-development-secret-key-at-least-32-chars-long-for-hmac-sha256"
    issuer: "grid-sentinel"
    access-token-expiration: 3600
    refresh-token-expiration: 604800

server:
  port: 8080
  servlet:
    context-path: /api/v1

logging:
  level:
    com.gridsentinel: DEBUG
    org.springframework.web.socket: DEBUG
    org.springframework.messaging: DEBUG